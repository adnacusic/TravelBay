services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: travelbay-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${DB_SA_PASSWORD}
    ports:
      - "${DB_PORT}:1433"
    volumes:
      - travelbay_sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3.13.7-management
    container_name: travelbay-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - travelbay_rabbitmq_data:/var/lib/rabbitmq

  api:
    build:
      context: .
      dockerfile: TravelBay.WebAPI/Dockerfile
    container_name: travelbay-api
    env_file:
      - .env
    environment:
      # Overrides .env's host-machine defaults with the in-network service name/port.
      DB_HOST: sqlserver
      DB_PORT: 1433
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    ports:
      - "${API_HTTP_PORT}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  # Separate service (second container besides the API): Python AI agents consuming RabbitMQ jobs.
  worker:
    build:
      context: ./TravelBay.Worker
      dockerfile: Dockerfile
    container_name: travelbay-worker
    env_file:
      - .env
    environment:
      DB_HOST: sqlserver
      DB_PORT: 1433
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    restart: unless-stopped

volumes:
  travelbay_sqlserver_data:
  travelbay_rabbitmq_data:
